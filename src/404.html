<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Страница не найдена — MediaGallery</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,sans-serif;background:#f8f9ff;color:#0b1c30;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(560px,100%);background:#fff;border-radius:20px;padding:40px 28px;text-align:center;box-shadow:0 10px 35px rgba(33,49,69,.08)}
    .code{font-size:56px;font-weight:800;color:#4f46e5;line-height:1}
    h1{font-size:24px;margin:18px 0 8px}
    p{margin:0;color:#5e6070;line-height:1.5}
    a{display:inline-flex;margin-top:24px;padding:11px 18px;border-radius:12px;background:#4f46e5;color:white;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>Страница не найдена</h1>
    <p>Такой страницы нет или адрес был указан неверно.</p>
    <a href="/">На главную</a>
  </main>
</body>
</html>
